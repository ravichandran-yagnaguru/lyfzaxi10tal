# Weekly posting schedule -- a fixed set of times per day of week. Edit this,
# then re-run manage_schedule.py to sync live Cloud Scheduler jobs to match
# (no Cloud Run redeploy needed). Days with identical time lists share the
# same Cloud Scheduler job (via cron's day-of-week list), and since every
# time below is on the hour, every day sharing the same 4 times collapses to
# a single Cloud Scheduler job (well within the free tier of 3).
#
# Bumped 2/day -> 4/day on 2026-09-27 (explicit request, timing left to
# Claude's judgment) now that the dynamic-topic + no-fallback-bank engine has
# a couple weeks of healthy real-world data behind it. Re-anchored Pacific ->
# Eastern earlier: the English-language audience density sits on ET, and
# peak windows are 8-10am, 12-2pm, 5-7pm ET. Slots below: 08:00 and 12:00 hit
# the first two windows directly, 17:00 hits the third, 20:00 adds an evening
# slot outside all three for time-of-day variety.
#
# NOTE: the idiom format has its own separate Cloud Scheduler job
# (concept-bot-idiom-daily: 10:00 & 19:00 America/New_York daily, hitting
# /post?format=idiom). It is NOT managed by this file or manage_schedule.py --
# the sync script only touches jobs whose name contains "concept-bot-post",
# so it will never delete or modify the idiom job. Change the idiom cadence
# directly via gcloud. Idiom slots sit roughly 2h from the nearest everyday
# slot on each side, well clear of the 20-minute duplicate-post guard.
#
# A third job, concept-bot-idiom-refill (04:30, 14:30, 22:30 ET, hitting
# /refill_idioms), also lives outside this file. It researches new idioms into
# the Firestore idiom_queue whenever fewer than 8 are ready, and is a cheap
# no-op otherwise. It sits off-peak so a research run never queues behind (or
# in front of) a post slot on the single gunicorn worker. Three jobs total:
# the full Cloud Scheduler free tier.
timezone: "America/New_York"
weekly_schedule:
  monday:    ["08:00", "12:00", "17:00", "20:00"]
  tuesday:   ["08:00", "12:00", "17:00", "20:00"]
  wednesday: ["08:00", "12:00", "17:00", "20:00"]
  thursday:  ["08:00", "12:00", "17:00", "20:00"]
  friday:    ["08:00", "12:00", "17:00", "20:00"]
  saturday:  ["08:00", "12:00", "17:00", "20:00"]
  sunday:    ["08:00", "12:00", "17:00", "20:00"]
