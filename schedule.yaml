# Weekly posting schedule -- a fixed set of times per day of week. Edit this,
# then re-run manage_schedule.py to sync live Cloud Scheduler jobs to match
# (no Cloud Run redeploy needed). Days with identical time lists share the
# same Cloud Scheduler job (via cron's day-of-week list), and since every
# time below is on the hour, each day-group's 4 times pack into a single
# cron hour-list -- so 4 posts/day across all 7 days still costs only 3
# Cloud Scheduler jobs (within the free tier). Every gap is >= 3 hours.
timezone: "America/Los_Angeles"
weekly_schedule:
  monday:    ["08:00", "11:00", "15:00", "19:00"]
  tuesday:   ["09:00", "12:00", "16:00", "20:00"]
  wednesday: ["10:00", "13:00", "17:00", "21:00"]
  thursday:  ["08:00", "11:00", "15:00", "19:00"]   # same as monday
  friday:    ["09:00", "12:00", "16:00", "20:00"]   # same as tuesday
  saturday:  ["10:00", "13:00", "17:00", "21:00"]   # same as wednesday
  sunday:    ["09:00", "12:00", "16:00", "20:00"]   # same as tuesday
