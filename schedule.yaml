# Weekly posting schedule -- a fixed set of times per day of week. Edit this,
# then re-run manage_schedule.py to sync live Cloud Scheduler jobs to match
# (no Cloud Run redeploy needed). Days with identical time lists share the
# same Cloud Scheduler job (via cron's day-of-week list), and since every
# time below is on the hour, every day sharing the same 2 times collapses to
# a single Cloud Scheduler job (well within the free tier of 3).
#
# Cut from 4/day to 2/day per the growth strategy doc (docs/GROWTH_STRATEGY.md
# section 6): per-post engagement rate is what the ranking system scores, and
# posting above what the quality gate can sustain dilutes that ratio. Ramp
# back up only once the gate is calibrated and per-post engagement is
# measured against real outcomes.
#
# Re-anchored Pacific -> Eastern: the English-language audience density sits
# on ET, and peak windows are 8-10am, 12-2pm, 5-7pm ET. The two slots below
# land in the morning and evening windows.
#
# NOTE: the idiom format has its own separate Cloud Scheduler job
# (concept-bot-idiom-daily: 14:00 America/New_York daily, hitting
# /post?format=idiom). It is NOT managed by this file or manage_schedule.py --
# the sync script only touches jobs whose name contains "concept-bot-post",
# so it will never delete or modify the idiom job. Change the idiom cadence
# directly via gcloud.
timezone: "America/New_York"
weekly_schedule:
  monday:    ["09:00", "18:00"]
  tuesday:   ["09:00", "18:00"]
  wednesday: ["09:00", "18:00"]
  thursday:  ["09:00", "18:00"]
  friday:    ["09:00", "18:00"]
  saturday:  ["09:00", "18:00"]
  sunday:    ["09:00", "18:00"]
